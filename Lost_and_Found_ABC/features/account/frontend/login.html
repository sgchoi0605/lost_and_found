<!doctype html>
<html lang="ko">
  <head>
    <!-- 로그인 화면의 제목·공통 스타일·전용 스타일입니다. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 | LOST & FOUND</title>
    <link rel="icon" href="/public/favicon.svg" />
    <link rel="stylesheet" href="../../../shared/frontend/css/base.css" />
    <link rel="stylesheet" href="../../../shared/frontend/css/components.css" />
    <link rel="stylesheet" href="./css/account.css" />
  </head>
  <body class="form-page">
    <!-- 공통 JS가 로그인 상태에 맞는 메뉴를 이곳에 만듭니다. -->
    <header class="account-header" data-account-layout></header>
    <!-- 본문 입력·조회·버튼 동작은 아래 JS 모듈에서 처리합니다. -->
    <main class="form-page-main">
      <section class="form-card auth-card">
        <span class="eyebrow">WELCOME BACK</span>
        <h1>로그인</h1>
        <p>내 신고와 알림을 확인하세요.</p>
        <p id="message" role="status" aria-live="polite" hidden></p>
        <form id="loginForm">
          <label class="field">
            <span>아이디</span>
            <input name="loginId" autocomplete="username" maxlength="30" required />
          </label>
          <label class="field">
            <span>비밀번호</span>
            <input
              name="password"
              type="password"
              autocomplete="current-password"
              maxlength="128"
              required
            />
          </label>
          <button class="btn btn-primary full" type="submit">로그인</button>
        </form>
        <p class="account-note">
          계정이 없으신가요?
          <a href="./signup.html">회원가입</a>
        </p>
      </section>
    </main>
    <!-- type="module"로 공통 함수를 import할 수 있게 합니다. -->
    <script type="module" src="./js/login.js"></script>
  </body>
</html>
