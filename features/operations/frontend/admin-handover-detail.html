
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>인계 신청 상세</title>

    <link rel="stylesheet" href="../../../shared/frontend/css/base.css">
    <link rel="stylesheet" href="../../../shared/frontend/css/components.css">
    <link rel="stylesheet" href="./css/operations.css">

    <script type="module" src="./js/admin-handover-detail.js"></script>
</head>

<body>
    <main class="detail-container">

        <header class="detail-header">
            <h1>인계 신청 상세</h1>
            <p>습득물 인계 신청 내용을 확인하고 처리합니다.</p>
        </header>

        <!-- 물품 정보 -->
        <section class="detail-card">
            <h2>물품 정보</h2>

            <div class="detail-row">
                <span>물품명</span>
                <strong id="item-name">정보를 불러오는 중입니다.</strong>
            </div>

            <div class="detail-row">
                <label for="found-date-input">습득 날짜</label>
                <input type="date" id="found-date-input">
            </div>

            <div class="detail-row">
                <label for="storage-location-input">보관 장소</label>
                <input
                    type="text"
                    id="storage-location-input"
                    placeholder="보관 장소를 입력하세요."
                >
            </div>

            <button type="button" id="save-item-info-button">
                물품 정보 저장
            </button>

            <p id="item-info-message"></p>
        </section>

        <!-- 신청자 정보 -->
        <section class="detail-card">
            <h2>신청자 정보</h2>

            <div class="detail-row">
                <span>신청자 이름</span>
                <strong id="applicant-name">정보를 불러오는 중입니다.</strong>
            </div>

            <div class="detail-row">
                <span>연락처</span>
                <strong id="applicant-contact">정보를 불러오는 중입니다.</strong>
            </div>

            <div class="detail-row">
                <span>신청 사유</span>
                <strong id="application-reason">정보를 불러오는 중입니다.</strong>
            </div>
        </section>

        <!-- 신청 처리 -->
        <section class="detail-card">
            <h2>신청 처리</h2>

            <p id="application-status">
                신청 정보를 불러오는 중입니다.
            </p>

            <div class="detail-actions">
                <button type="button" id="approve-button">
                    인계 승인
                </button>

                <button type="button" id="reject-button">
                    신청 거절
                </button>
            </div>

            <button id="reset-status-button" type="button">
                처리 취소 / 대기 상태로 되돌리기
            </button>

            <p id="result-message"></p>
        </section>

        <!-- 실제 인계 완료 처리 -->
        <section class="detail-card">
            <h2>실제 인계 완료 처리</h2>

            <p>
                신청자가 물품을 실제로 수령한 후 완료 정보를 입력하세요.
            </p>

            <div class="detail-row">
                <label for="completion-date-input">
                    인계 완료 날짜 및 시간
                </label>
                <input
                    type="datetime-local"
                    id="completion-date-input"
                    disabled
                >
            </div>

            <div class="detail-row">
                <label for="recipient-name-input">
                    실제 수령자 이름
                </label>
                <input
                    type="text"
                    id="recipient-name-input"
                    placeholder="수령자 이름을 입력하세요."
                    disabled
                >
            </div>

            <button
                type="button"
                id="complete-handover-button"
                disabled
            >
                인계 완료 처리
            </button>

            <p id="completion-message"></p>
        </section>

        <a class="back-link" href="./admin-handovers.html">
            목록으로 돌아가기
        </a>

    </main>
</body>
</html>
