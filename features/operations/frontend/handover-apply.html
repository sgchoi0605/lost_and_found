
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>인계 신청</title>

    <link rel="stylesheet" href="../../../shared/frontend/css/base.css">
    <link rel="stylesheet" href="../../../shared/frontend/css/components.css">
    <link rel="stylesheet" href="./css/operations.css">

    <script type="module" src="./js/handover-apply.js"></script>
</head>

<body>
    <main class="form-card">

        <h1>습득물 인계 신청</h1>

        <p>분실한 물품을 찾아 인계 신청을 진행합니다.</p>

        <form id="handover-form">

            <label for="item-name">물품명</label>
            <input
                type="text"
                id="item-name"
                name="itemName"
                placeholder="물품명을 입력하세요"
                maxlength="100"
                required
            >

            <label for="applicant-name">신청자 이름</label>
            <input
                type="text"
                id="applicant-name"
                name="applicantName"
                placeholder="이름을 입력하세요"
                maxlength="50"
                required
            >

            <label for="phone">연락처</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="연락처를 입력하세요"
                autocomplete="tel"
                maxlength="20"
                required
            >

            <label for="description">소유 증명 내용</label>
            <textarea
                id="description"
                name="description"
                placeholder="물품의 특징 등 본인 소유임을 증명할 내용을 입력하세요"
                maxlength="1000"
                required
            ></textarea>

            <button type="submit">인계 신청하기</button>

            <p
                id="result-message"
                role="status"
                aria-live="polite"
            ></p>

        </form>

        <a class="back-link" href="../../discovery/frontend/index.html">
            메인으로 돌아가기
        </a>

    </main>
</body>
</html>
