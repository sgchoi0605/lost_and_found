
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>인계 신청 현황</title>

    <link rel="stylesheet" href="../../../shared/frontend/css/base.css">
    <link rel="stylesheet" href="../../../shared/frontend/css/components.css">
    <link rel="stylesheet" href="./css/operations.css">

    <script type="module" src="./js/handover-status.js"></script>
</head>

<body>

    <main class="form-card">

        <header>
            <h1>인계 신청 현황</h1>
            <p>내가 신청한 물품 인계 요청의 진행 상황을 확인할 수 있습니다.</p>
        </header>

        <section class="detail-card">
            <h2>신청 내역</h2>

            <div id="handover-list">
                <!-- JavaScript에서 신청 내역 표시 -->
            </div>

            <p
                id="empty-message"
                role="status"
                aria-live="polite"
                hidden
            >
                신청한 인계 내역이 없습니다.
            </p>
        </section>

        <a class="back-link" href="../../discovery/frontend/index.html">
            메인으로 돌아가기
        </a>

    </main>

</body>
</html>
