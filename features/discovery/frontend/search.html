
<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분실·습득물 검색 | Lost & Found</title>

    <link rel="stylesheet" href="../../../shared/frontend/css/base.css">
    <link rel="stylesheet" href="../../../shared/frontend/css/components.css">
    <link rel="stylesheet" href="./css/discovery.css">
</head>

<body>

<main class="form-card">

    <a href="/features/discovery/frontend/index.html">
        ← 메인으로 돌아가기
    </a>

    <h1>분실·습득물 검색</h1>

    <p>찾고 있는 물품의 정보를 입력해 주세요.</p>

    <!-- 검색 및 필터 영역 -->
    <form id="searchForm">

        <div class="form-grid">

            <!-- 물품 이름 -->
            <label for="q" class="wide">
                <span>물품 이름</span>

                <input type="text"
                       id="q"
                       name="q"
                       placeholder="예: 지갑, 에어팟">
            </label>

            <!-- 신고 유형 -->
            <label for="reportType">
                <span>신고 유형</span>

                <select id="reportType" name="reportType">
                    <option value="">전체</option>
                    <option value="LOST">분실물</option>
                    <option value="FOUND">습득물</option>
                </select>
            </label>

            <!-- 카테고리 -->
            <label for="category">
                <span>카테고리</span>

                <input type="text"
                       id="category"
                       name="category"
                       placeholder="예: 전자기기">
            </label>

            <!-- 장소 -->
            <label for="place">
                <span>장소</span>

                <input type="text"
                       id="place"
                       name="place"
                       placeholder="예: 중앙도서관">
            </label>

            <!-- 신고 상태 -->
            <label for="status">
                <span>신고 상태</span>

                <select id="status" name="status">
                    <option value="">전체</option>
                    <option value="REPORTED">신고됨</option>
                    <option value="RECEIVED">접수됨</option>
                    <option value="STORED">보관 중</option>
                    <option value="MATCHED">매칭됨</option>
                    <option value="HANDOVER_IN_PROGRESS">
                        인계 진행 중
                    </option>
                    <option value="HANDED_OVER">인계 완료</option>
                    <option value="DISPOSED">폐기</option>
                    <option value="TRANSFERRED">이관</option>
                </select>
            </label>

            <!-- 시작 날짜 -->
            <label for="startDate">
                <span>시작 날짜</span>

                <input type="date"
                       id="startDate"
                       name="startDate">
            </label>

            <!-- 종료 날짜 -->
            <label for="endDate">
                <span>종료 날짜</span>

                <input type="date"
                       id="endDate"
                       name="endDate">
            </label>

        </div>

        <!-- 검색 버튼 -->
        <div class="form-actions">

            <button type="submit"
                    class="btn btn-primary">
                검색하기
            </button>

            <button type="button"
                    class="btn btn-secondary"
                    id="resetButton">
                초기화
            </button>

        </div>

    </form>

    <hr>

    <!-- 검색 결과 영역 -->
    <section>

        <h2>검색 결과</h2>

        <p id="resultCount" aria-live="polite"></p>

        <p id="message" role="status"></p>

        <div id="searchResults"></div>

        <!-- 페이지 이동 -->
        <div id="pagination" hidden>

            <button type="button" id="prevButton">
                이전
            </button>

            <span id="pageInfo"></span>

            <button type="button" id="nextButton">
                다음
            </button>

        </div>

    </section>

</main>

<script type="module" src="./js/search.js"></script>

</body>
</html>
