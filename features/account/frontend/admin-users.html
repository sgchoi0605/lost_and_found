<!doctype html>
<html lang="ko">
  <head>
    <!-- 사용자 관리 화면의 제목·공통 스타일·전용 스타일입니다. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>사용자 관리 | LOST & FOUND</title>
    <link rel="icon" href="/public/favicon.svg" />
    <link rel="stylesheet" href="../../../shared/frontend/css/base.css" />
    <link rel="stylesheet" href="../../../shared/frontend/css/components.css" />
    <link rel="stylesheet" href="./css/account.css" />
  </head>
  <body>
    <!-- 공통 JS가 로그인 상태에 맞는 메뉴를 이곳에 만듭니다. -->
    <header class="account-header" data-account-layout></header>
    <!-- 본문 입력·조회·버튼 동작은 아래 JS 모듈에서 처리합니다. -->
    <main class="account-main" hidden>
      <span class="eyebrow">ADMINISTRATION</span>
      <h1>사용자 관리</h1>
      <p>
        사용자를 확인하고 부적절한 이용자의 신고 등록을 제한합니다. 변경 사유는 이력에 남습니다.
      </p>
      <p id="message" role="status" aria-live="polite" hidden></p>
      <form id="searchUsers" class="account-toolbar">
        <label class="field">
          <span>사용자 검색</span>
          <input name="q" type="search" placeholder="아이디·이름·이메일" maxlength="100" />
        </label>
        <button class="btn btn-primary" type="submit">검색</button>
        <button id="retry" type="button" class="btn btn-secondary">새로고침</button>
      </form>
      <ul id="users" class="account-list"></ul>
      <nav class="account-pagination" aria-label="사용자 페이지">
        <button id="prev" type="button" class="btn btn-secondary">이전</button>
        <span id="page"></span>
        <button id="next" type="button" class="btn btn-secondary">다음</button>
      </nav>
    </main>
    <!-- type="module"로 공통 함수를 import할 수 있게 합니다. -->
    <script type="module" src="./js/admin-users.js"></script>
  </body>
</html>
