<!doctype html>
<html lang="ko">
  <head>
    <!-- 화면 제목과 공통·기능별 스타일을 불러옵니다. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>습득물 등록 | LOST & FOUND</title>
    <link rel="icon" href="../../../public/favicon.svg" />
    <link rel="stylesheet" href="../../../shared/frontend/css/base.css" />
    <link rel="stylesheet" href="../../../shared/frontend/css/components.css" />
    <link rel="stylesheet" href="./css/reports.css" />
  </head>
  <body class="form-page">
    <!-- 상단 로고 및 홈 이동 링크를 표시합니다. -->
    <header class="simple-header">
      <a class="logo-wrap" href="/features/discovery/frontend/index.html">
        <span class="logo-mark">⌖</span>
        <span><strong>LOST <i>&</i> FOUND</strong><small>다시 만나는 가장 따뜻한 방법</small></span>
      </a>
      <a class="back-link" href="/features/discovery/frontend/index.html">← 홈으로 돌아가기</a>
    </header>

    <!-- 습득물 등록 폼 본문 영역입니다. -->
    <main class="form-page-main">
      <section class="form-card report-form-card">
        <span class="eyebrow">FOUND REPORT</span>
        <h1>새 습득물 등록</h1>
        <p>주운 물건 정보를 올려주시면 주인을 찾는 데 큰 도움이 돼요.</p>

        <form id="foundForm" novalidate>
          <!-- 습득물 사진 업로드 영역입니다. -->
          <label class="upload-zone" for="itemPhoto">
            <span class="upload-symbol">↑</span>
            <b>습득한 물건 사진을 올려주세요</b>
            <small id="fileName">JPG, PNG · 최대 10MB</small>
            <input id="itemPhoto" name="photo" type="file" accept="image/png,image/jpeg" hidden />
          </label>

          <!-- 습득물 상세 정보 입력 영역입니다. -->
          <div class="form-grid">
            <label class="field">
              <span>물품명</span>
              <input name="itemName" placeholder="예: 검정색 에어팟 프로" required />
            </label>

            <label class="field">
              <span>카테고리</span>
              <select name="category" required>
                <option value="">선택하세요</option>
                <option value="지갑">지갑</option>
                <option value="전자기기">전자기기</option>
                <option value="카드">카드</option>
                <option value="가방">가방</option>
                <option value="열쇠">열쇠</option>
                <option value="기타">기타</option>
              </select>
            </label>

            <label class="field">
              <span>습득 장소 · 동작구</span>
              <select name="place" required>
                <option value="">동작구 장소를 선택하세요</option>
                <option value="노량진동">노량진동</option>
                <option value="상도동">상도동</option>
                <option value="흑석동">흑석동</option>
                <option value="사당동">사당동</option>
                <option value="대방동 · 신대방동">대방동 · 신대방동</option>
                <option value="동작동">동작동</option>
              </select>
            </label>

            <label class="field">
              <span>습득 날짜</span>
              <input name="date" type="date" required />
            </label>

            <label class="field wide">
              <span>현재 보관 장소</span>
              <input name="storagePlace" placeholder="예: 사당지구대 맡김 / 직접 보관 중" required />
            </label>

            <label class="field wide">
              <span>특징</span>
              <textarea name="details" placeholder="색상, 브랜드, 케이스 유무 등 특징을 적어주세요."></textarea>
            </label>
          </div>

          <!-- 폼 취소 및 제출 버튼 영역입니다. -->
          <div class="form-actions">
            <a class="btn btn-secondary" href="/features/discovery/frontend/index.html">취소</a>
            <button class="btn btn-primary" type="submit">습득물 등록하기</button>
          </div>
        </form>
      </section>
    </main>

    <!-- 습득물 등록 이벤트를 처리하는 JS 모듈을 연결합니다. -->
    <script type="module" src="./js/found-report.js"></script>
  </body>
</html>
