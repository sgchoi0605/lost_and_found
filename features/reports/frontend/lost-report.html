<!doctype html>
<html lang="ko">
  <head>
    <!-- 화면 제목과 공통·기능별 스타일을 불러오는 설정입니다. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>분실물 등록 | LOST & FOUND</title>
    <link rel="icon" href="../../../public/favicon.svg" />
    <link rel="stylesheet" href="../../../shared/frontend/css/base.css" />
  <link rel="stylesheet" href="../../../shared/frontend/css/components.css"><link rel="stylesheet" href="./css/reports.css"></head>
  <body class="form-page">
    <!-- 화면 이동 링크는 Vite와 Express에서 모두 열리는 루트 기준 경로를 사용합니다. -->
    <header class="simple-header">
      <a class="logo-wrap" href="/features/discovery/frontend/index.html">
        <span class="logo-mark">⌖</span>
        <span><strong>LOST <i>&</i> FOUND</strong><small>다시 만나는 가장 따뜻한 방법</small></span>
      </a>
      <a class="back-link" href="/features/discovery/frontend/index.html">← 홈으로 돌아가기</a>
    </header>
    <!-- 화면 본문입니다. 현재 입력·검색은 데모이며 서버 인증이나 저장은 연결되지 않았습니다. -->
    <main class="form-page-main">
      <section class="form-card report-form-card">
        <span class="eyebrow">LOST REPORT</span>
        <h1>새 분실물 등록</h1>
        <p>기억나는 만큼 알려주시면 동작구에 접수된 습득물과 비교해 드려요.</p>
        <form id="reportForm" data-unimplemented="B:5" novalidate>
          <label class="upload-zone" for="itemPhoto">
            <span class="upload-symbol">↑</span>
            <b>물건 사진을 올려주세요</b>
            <small id="fileName">JPG, PNG · 최대 10MB</small>
            <input id="itemPhoto" name="photo" type="file" accept="image/png,image/jpeg" hidden />
          </label>
          <div class="form-grid">
            <label class="field"><span>물품명</span><input name="itemName" placeholder="예: 브라운 카드 지갑" required /></label>
            <label class="field"><span>카테고리</span><select name="category" required><option value="">선택하세요</option><option>지갑</option><option>전자기기</option><option>카드</option><option>가방</option><option>열쇠</option><option>기타</option></select></label>
            <label class="field"><span>분실 장소 · 동작구</span><select name="place" required><option value="">동작구 장소를 선택하세요</option><option>노량진동</option><option>상도동</option><option>흑석동</option><option>사당동</option><option>대방동 · 신대방동</option><option>동작동</option></select></label>
            <label class="field"><span>분실 날짜</span><input name="date" type="date" required /></label>
            <label class="field wide"><span>특징</span><textarea name="details" placeholder="색상, 브랜드, 흠집 등 물건의 특징을 적어주세요."></textarea></label>
          </div>
          <div class="form-actions"><a class="btn btn-secondary" href="/features/discovery/frontend/index.html">취소</a><button class="btn btn-primary" type="submit" data-unimplemented="B:5">신고 등록하기</button></div>
        </form>
      </section>
    </main>
    <!-- 이 화면의 이벤트를 처리하는 JS 모듈을 연결합니다. -->
    <script type="module" src="./js/lost-report.js"></script>
  </body>
</html>
