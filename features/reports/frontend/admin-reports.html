<!doctype html>
<html lang="ko">
  <head>
    <!-- 화면 제목과 공통·기능별 스타일을 불러옵니다. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 신고 관리 | LOST & FOUND</title>
    <link rel="icon" href="../../../public/favicon.svg" />
    <link rel="stylesheet" href="../../../shared/frontend/css/base.css" />
    <link rel="stylesheet" href="../../../shared/frontend/css/components.css" />
    <link rel="stylesheet" href="./css/reports.css" />
  </head>
  <body class="form-page">
    <!-- 상단 로고 및 홈 이동 링크를 표시합니다. -->
    <header class="simple-header">
      <a class="logo-wrap" href="/features/discovery/frontend/index.html">
        <span class="logo-mark">⌖</span>
        <span><strong>LOST <i>&</i> FOUND</strong><small>다시 만나는 가장 따뜻한 방법</small></span>
      </a>
      <a class="back-link" href="/features/discovery/frontend/index.html">← 홈으로 돌아가기</a>
    </header>

    <!-- 관리자 신고 목록 본문 영역입니다. -->
    <main class="form-page-main">
      <section class="form-card admin-reports-card">
        <div class="list-header">
          <div>
            <span class="eyebrow">ADMIN REPORTS</span>
            <h1>전체 신고 관리</h1>
            <p>접수된 분실물·습득물 신고의 진행 상태를 확인하고 관리합니다.</p>
          </div>

          <!-- DB 계약 상태값 기준 필터 선택 영역입니다. -->
          <select id="statusFilter" class="status-select" aria-label="신고 상태 필터">
            <option value="all">전체 상태</option>
            <option value="REPORTED">신고됨</option>
            <option value="RECEIVED">접수됨</option>
            <option value="STORED">보관 중</option>
            <option value="MATCHED">매칭됨</option>
            <option value="HANDOVER_IN_PROGRESS">인계 진행 중</option>
            <option value="HANDED_OVER">인계 완료</option>
            <option value="DISPOSED">폐기</option>
            <option value="TRANSFERRED">이관</option>
          </select>
        </div>

        <!-- JS에서 전체 신고 목록을 동적으로 렌더링하는 영역입니다. -->
        <div id="adminReportList" class="my-report-list"></div>
      </section>
    </main>

    <script type="module" src="./js/admin-reports.js"></script>
  </body>
</html>
