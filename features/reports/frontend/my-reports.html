<!doctype html>
<html lang="ko">
  <head>
    <!-- 화면 제목과 공통·기능별 스타일을 불러옵니다. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내 신고 내역 | LOST & FOUND</title>
    <link rel="icon" href="../../../public/favicon.svg" />
    <link rel="stylesheet" href="../../../shared/frontend/css/base.css" />
    <link rel="stylesheet" href="../../../shared/frontend/css/components.css" />
    <link rel="stylesheet" href="./css/reports.css" />
  </head>
  <body class="form-page">
    <!-- 상단 로고 및 홈 이동 링크를 표시합니다. -->
    <header class="simple-header">
      <a class="logo-wrap" href="/features/discovery/frontend/index.html">
        <span class="logo-mark">⌖</span>
        <span><strong>LOST <i>&</i> FOUND</strong><small>다시 만나는 가장 따뜻한 방법</small></span>
      </a>
      <a class="back-link" href="/features/discovery/frontend/index.html">← 홈으로 돌아가기</a>
    </header>

    <!-- 내 신고 목록 본문 영역입니다. -->
    <main class="form-page-main">
      <section class="form-card my-reports-card">
        <div class="list-header">
          <div>
            <span class="eyebrow">MY REPORTS</span>
            <h1>내 신고 내역</h1>
            <p>등록한 분실물과 습득물의 진행 상태를 확인할 수 있습니다.</p>
          </div>
          <!-- 새 신고 등록 화면으로 이동하는 버튼입니다. -->
          <div class="list-header-actions">
            <a class="btn btn-secondary" href="./found-report.html">습득물 등록</a>
            <a class="btn btn-primary" href="./lost-report.html">분실물 등록</a>
          </div>
        </div>

        <!-- JS에서 신고 목록을 동적으로 렌더링하는 영역입니다. -->
        <div id="myReportList" class="my-report-list"></div>
      </section>
    </main>

    <!-- 내 신고 목록 조회 및 삭제 이벤트를 처리하는 JS 모듈을 연결합니다. -->
    <script type="module" src="./js/my-reports.js"></script>
  </body>
</html>
